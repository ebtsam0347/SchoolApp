apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

configMapGenerator:
  - name: web-config
    behavior: replace
    literals:
      - UPSTREAM_GATEWAY=http://gateway.prod.svc.cluster.local:8080

images:
  - name: web
    newName: 10.10.100.51:5001/web
    newTag: "GIT_SHA_PLACEHOLDER"

patches:
  - path: deployment-patch.yaml
