# Cloudflare Pages config. Deploy with `npm run deploy` (or connect the repo
# in the Cloudflare dashboard: root dir = frontend-main, build = `npm run build`,
# output = `dist`).
name = "spirit-school-hrms"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

# Public URL of the backend gateway (no trailing slash). The Pages Function
# in functions/api/[[path]].ts proxies /api/* here, mirroring nginx.conf.template.
# Override per environment in the dashboard: Settings -> Variables and Secrets.
[vars]
UPSTREAM_GATEWAY = "https://api.example.com"
