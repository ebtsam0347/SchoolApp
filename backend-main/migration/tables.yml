# Tables to replicate from legacy MSSQL (WebHRMS, dbo schema) into local
# Postgres `staging` schema. Run with `replicate.py`.
#
# Edit by commenting / uncommenting the table name. The replicator reads
# `tables` as a flat list of strings.
#
# Curated 2026-05-01 against `triage.md`. Out-of-scope modules (assets,
# documents, evaluation, requisitions, kaizen, fairprice, medical, prayer,
# ANPR/visitors, canteen, factory ops, Django framework) are excluded.

source_schema: dbo
target_schema: staging

# Default cutoff for entries that set `since_column`.
#
# `since_date` is an ABSOLUTE date and takes precedence over `since_days`.
# Prod cutover carries the current fiscal year only (FY 2026-27, Jul-Jun),
# so the windowed tables start at 2026-07-01 and the legacy system stays
# the archive of record for anything older. A rolling `since_days` would
# quietly move that boundary every day the cutover slips, which is why the
# fiscal-year load is pinned to a date instead.
#
# Override per-table with `since_date:` or `since_days:` on the entry.
defaults:
  since_date: 2026-07-01

