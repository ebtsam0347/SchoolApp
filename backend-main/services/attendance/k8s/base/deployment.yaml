apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance
  labels:
    app: attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attendance
  template:
    metadata:
      labels:
        app: attendance
    spec:
      containers:
        - name: attendance
          image: attendance
          imagePullPolicy: IfNotPresent
          ports:
            - name: app
              containerPort: 8083
            - name: mgmt
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: attendance-config
            - secretRef:
                name: attendance-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: mgmt
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
