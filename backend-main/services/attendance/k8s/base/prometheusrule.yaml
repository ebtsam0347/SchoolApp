apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: attendance
  labels:
    app: attendance
    release: kps
spec:
  groups:
    - name: attendance.slo
      rules:
        # 5xx rate above 5% for 5m — most likely to surface real bugs.
        - alert: AttendanceHighErrorRate
          expr: |
            sum by (namespace) (rate(http_server_requests_seconds_count{app="attendance",status=~"5.."}[5m]))
              /
            sum by (namespace) (rate(http_server_requests_seconds_count{app="attendance"}[5m]))
              > 0.05
          for: 5m
          labels:
            severity: warning
            service: attendance
          annotations:
            summary: "attendance 5xx rate > 5% (ns {{ $labels.namespace }})"
            description: "5xx rate is {{ $value | humanizePercentage }} over the last 5m."

        # No instances scraping at all — pod gone or mgmt port down.
        - alert: AttendanceDown
          expr: up{job="attendance"} == 0
          for: 2m
          labels:
            severity: critical
            service: attendance
          annotations:
            summary: "attendance is down (ns {{ $labels.namespace }})"
            description: "No Prometheus targets for attendance are reporting up=1 for 2 minutes."

        # p95 above 1s sustained — pre-incident latency signal.
        - alert: AttendanceHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (namespace, le) (rate(http_server_requests_seconds_bucket{app="attendance"}[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
            service: attendance
          annotations:
            summary: "attendance p95 latency > 1s (ns {{ $labels.namespace }})"
            description: "p95 latency is {{ $value | humanizeDuration }} over the last 5m, sustained 10m."

        # Heap pool used > 90% of committed for 10m — about to OOM, GC thrashing soon.
        - alert: AttendanceJvmHeapPressure
          expr: |
            sum by (namespace, pod) (jvm_memory_used_bytes{app="attendance",area="heap"})
              /
            sum by (namespace, pod) (jvm_memory_committed_bytes{app="attendance",area="heap"})
              > 0.9
          for: 10m
          labels:
            severity: warning
            service: attendance
          annotations:
            summary: "attendance JVM heap > 90% on {{ $labels.pod }}"
            description: "Heap used / committed is {{ $value | humanizePercentage }} for 10m. Consider raising memory limits or investigating a leak."

        # HikariCP threads waiting on a connection — DB pool starvation.
        # Fires only on services with a DataSource (auth/audit/employee/
        # attendance/payroll/notification/chat). Gateway/bff have no metric
        # so the rule silently no-ops.
        - alert: AttendanceHikariConnectionStarvation
          expr: |
            max by (namespace, pod) (hikaricp_connections_pending{app="attendance"}) > 0
          for: 5m
          labels:
            severity: warning
            service: attendance
          annotations:
            summary: "attendance DB pool starved on {{ $labels.pod }}"
            description: "{{ $value }} thread(s) waiting for a HikariCP connection for 5m. Tune pool size or investigate slow queries."

        # attendance-poller liveness, observed from this side of the call.
        # The poller hits GET /devices/poller-targets every tick (default
        # 60s) regardless of whether anyone punched, so a zero rate on
        # this endpoint means the poller pod is gone, crash-looping, or
        # can't reach attendance. Punches/ingest is a worse signal because
        # it's empty after-hours; heartbeats fire only when there's an
        # active device. This URI is literal (no path template) so the
        # label match is stable.
        - alert: AttendancePollerStalled
          expr: |
            sum by (namespace) (rate(http_server_requests_seconds_count{app="attendance",uri="/devices/poller-targets"}[5m])) == 0
          for: 5m
          labels:
            severity: warning
            service: attendance
          annotations:
            summary: "attendance-poller has not polled in 5m (ns {{ $labels.namespace }})"
            description: "No GET /devices/poller-targets calls observed for 5m sustained 5m. Check the attendance-poller pod and its connectivity to the device LAN."
