apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  TZ: "Asia/Karachi"
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Karachi"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  HRMS_ZIPKIN_ENDPOINT: http://zipkin.observability.svc.cluster.local:9411/api/v2/spans
  AUTH_BASE_URL: "http://auth:8081"
  AUDIT_BASE_URL: "http://audit:8085"
  EMPLOYEE_BASE_URL: "http://employee:8082"
  ATTENDANCE_BASE_URL: "http://attendance:8083"
  NOTIFICATION_BASE_URL: "http://notification:8084"
  PAYROLL_BASE_URL: "http://payroll:8087"
  CHAT_BASE_URL: "http://chat:8088"
  BFF_BASE_URL: "http://bff:8086"
  HRMS_OPENAPI_SERVER_URL: "http://api.uat.hrms.local"