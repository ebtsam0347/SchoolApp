apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base
  - sealed-secret.yaml

configMapGenerator:
  - name: audit-config
    behavior: merge
    literals:
      - HRMS_OPENAPI_SERVER_URL=https://hrms.forward.pk/api
      - DB_NAME=prod
      - DB_HOST=10.10.100.51
      - KAFKA_BROKERS=10.10.100.51:9092

images:
  - name: audit
    newName: 10.10.100.51:5001/audit
    newTag: "GIT_SHA_PLACEHOLDER"

patches:
  - path: deployment-patch.yaml
