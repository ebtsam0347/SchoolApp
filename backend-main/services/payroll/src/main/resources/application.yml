spring:
  application:
    name: payroll
  datasource:
    # currentSchema sets the JDBC connection's search_path so unqualified
    # native SQL (e.g. PayrollRunSequenceService upserts) resolves against
    # the payroll schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fshrms}?currentSchema=payroll
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: payroll
  flyway:
    enabled: true
    default-schema: payroll
    schemas: payroll
    out-of-order: true
    locations: classpath:db/migration,classpath:db/commons-outbox,classpath:db/commons-saga,classpath:db/commons-approval
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: payroll
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8087

hrms:
  approval:
    permissions:
      read: payroll.read
      write: payroll.write
      admin: payroll.admin
      override: payroll.approval.override
  cache:
    # commons-cache (Redis) — employee display + employee-service catalogs.
    # Used by composite endpoints (run detail, payslip queue, off-cycle list,
    # etc.) and by report rendering to attach employee names without
    # fanning out to employee-service per row.
    enabled: true
    employee-service-url: ${EMPLOYEE_BASE_URL:http://localhost:8082}
  employee:
    base-url: ${EMPLOYEE_BASE_URL:http://localhost:8082}
  attendance:
    base-url: ${ATTENDANCE_BASE_URL:http://localhost:8083}
  fair-price-shop:
    # Read-only login on the shop's SQL Server; payroll reads
    # dbo.View_FairPrice_Out only (FairPriceShopClient).
    jdbc-url: ${FAIR_PRICE_SHOP_JDBC_URL:jdbc:sqlserver://10.10.100.14:1433;databaseName=HRMS;encrypt=false}
    username: ${FAIR_PRICE_SHOP_USERNAME:}
    password: ${FAIR_PRICE_SHOP_PASSWORD:}
  openapi:
    title: Spirit of Islam School HRMS — Payroll API
    description: |
      Compensation: salary basics + components, monthly payroll runs,
      payslips, statutory deductions (EOBI / PESSI), gratuity calculator,
      final-settlement preview, off-cycle payments, Eid bonus events,
      bulk increment batches. Generates payslip PDFs to MinIO and hosts
      the payroll-run saga.
    contact-name: The Spirit of Islam School IT team
    contact-email: it@forwardsports.com
    server-url: ${HRMS_OPENAPI_SERVER_URL:http://localhost:8080}
    server-description: API gateway (single ingress)
  outbox:
    enabled: true
    poll-delay: 1s
    batch-size: 100
  payroll:
    payslips:
      bucket: payslips
      download-url-ttl: 10m
    standard-monthly-hours: 208
    report-jobs:
      poll-delay: ${HRMS_PAYROLL_REPORT_JOBS_POLL_DELAY:PT2S}
    reports:
      download-url-ttl: 10m
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Defaults match docker-compose's MinIO root user, for IDE runs without
    # env vars. Without a default, config binding leaves the literal
    # "${MINIO_ACCESS_KEY}" as the key and MinIO answers InvalidAccessKeyId.
    # Cluster overlays always set both via the sealed secret.
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    region: ${MINIO_REGION:us-east-1}
    ensure-buckets:
      - payslips
      - reports
    default-url-ttl: 10m
