apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll
  labels:
    app: payroll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payroll
  template:
    metadata:
      labels:
        app: payroll
    spec:
      containers:
        - name: payroll
          image: payroll
          imagePullPolicy: IfNotPresent
          ports:
            - name: app
              containerPort: 8087
            - name: mgmt
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: payroll-config
            - secretRef:
                name: payroll-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: mgmt
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
