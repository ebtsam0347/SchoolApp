spring:
  application:
    name: auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fshrms}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: auth
  flyway:
    enabled: true
    default-schema: auth
    schemas: auth
    out-of-order: true
    locations: classpath:db/migration,classpath:db/commons-outbox
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      # group-id is set per-listener (@KafkaListener(groupId = "auth.<topic>"))
      # so the consumer-group has no global default — anything here would be
      # dead config, see §7.auth #37.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8081

hrms:
  openapi:
    title: Spirit of Islam School HRMS — Auth API
    description: |
      Authentication, authorisation, user/role/permission admin, and session
      management for The Spirit of Islam School HRMS. Login at POST /auth/login, then click
      "Authorize" and paste the access token to call protected endpoints.
    contact-name: The Spirit of Islam School IT team
    contact-email: it@forwardsports.com
    # Aggregated Swagger UI lives at the gateway (default :8080). "Try it out"
    # then exercises the real ingress flow (auth, correlation-id, rate limits).
    # Override via HRMS_OPENAPI_SERVER_URL when running this service standalone.
    server-url: ${HRMS_OPENAPI_SERVER_URL:http://localhost:8080}
    server-description: API gateway (single ingress)
  auth:
    jwt:
      issuer: fshrms-auth
      audience: fshrms
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      # Dev keypair shipped in commons-web. Override in UAT/prod via env, e.g.
      #   HRMS_AUTH_JWT_PRIVATE_KEY_LOCATION=file:/etc/fshrms/auth/jwt-private.pem
      #   HRMS_AUTH_JWT_PUBLIC_KEY_LOCATION=file:/etc/fshrms/auth/jwt-public.pem
      private-key-location: ${HRMS_AUTH_JWT_PRIVATE_KEY_LOCATION:classpath:dev-keys/jwt-private.pem}
      public-key-location:  ${HRMS_AUTH_JWT_PUBLIC_KEY_LOCATION:classpath:dev-keys/jwt-public.pem}
    bootstrap-admin:
      username: admin
      # Default kept for local-dev convenience. UAT/Prod overrides via the
      # auth sealed-secret in k8s/overlays/<env>/sealed-secret.yaml.
      password: ${HRMS_AUTH_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe!2026}
      full-name: System Administrator
  outbox:
    enabled: true
    poll-delay: 1s
    batch-size: 100
  audit:
    # audit-service base URL — used by the admin login-history proxy.
    # The endpoint returns 5xx until audit-service is running.
    base-url: ${AUDIT_BASE_URL:http://localhost:8085}
