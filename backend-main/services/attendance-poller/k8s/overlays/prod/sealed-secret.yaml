# Placeholder. Regenerate at Phase 7 with the public cert at
#   server-setup/k8s/platform/sealed-secrets-prod.pub.pem
# POLLER_TOKEN is a long-lived RS256 service-account JWT issued by auth's
# POST /admin/users/{id}/service-tokens (see auth-service AdminUserController)
# for a prod service-account user holding `attendance.poller`. Same
# provisioning path as overlays/uat/sealed-secret.yaml, pointed at prod:
#
#   ADMIN_PASS="..." /tmp/provision-poller.sh > sealed-secret.yaml
#
# (issue against the prod auth base URL, reseal with the prod cert above)
# Rotation: re-issue via the same endpoint and re-seal. Token expires 365
# days from issue.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: attendance-poller-secret
  namespace: prod
spec:
  encryptedData: {}
  template:
    metadata:
      name: attendance-poller-secret
      namespace: prod
    type: Opaque
