# SealedSecret for the attendance-poller. POLLER_TOKEN is a long-lived
# RS256 service-account JWT issued by auth's POST /admin/users/{id}/service-tokens
# (see auth-service AdminUserController). Sealed with the cluster's
# bitnami sealed-secrets controller key on the VM.
#
# Rotation: re-issue via the same endpoint and re-seal:
#
#   ADMIN_PASS="..." /tmp/provision-poller.sh > sealed-secret.yaml
#
# The token expires 365 days from issue. Track expiry against the jti
# audit row in audit-service if you want a calendar reminder.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: attendance-poller-secret
  namespace: uat
spec:
  encryptedData:
    POLLER_TOKEN: 
  template:
    metadata:
      name: attendance-poller-secret
      namespace: uat
