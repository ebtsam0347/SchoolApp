apiVersion: v1
kind: ConfigMap
metadata:
  name: attendance-poller-config
data:
  TZ: "Asia/Karachi"
  # Through the gateway, not attendance directly. Resource services run
  # `hrms.security.identity-source=header` and trust X-User-* headers
  # forwarded from the gateway after JWT validation; a Bearer token sent
  # straight to attendance is ignored and the request is treated as
  # anonymous (403 on @RequirePermission). The gateway routes
  # /devices/**, /attendance/**, and /templates/** to attendance.
  POLLER_BASE_URL: "http://gateway.uat.svc.cluster.local:8080"
  POLLER_INTERVAL: "60"
  POLLER_BATCH_SIZE: "200"
  POLLER_VERBOSE: "false"
  HRMS_OPENAPI_SERVER_URL: "http://api.uat.hrms.local"