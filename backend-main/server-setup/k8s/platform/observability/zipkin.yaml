# Single-replica Zipkin in `observability` namespace.
# In-memory storage — restart loses traces, fine for dev/UAT/prod sampling use.
# Services send to http://zipkin.observability.svc.cluster.local:9411

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: observability
  labels: { app.kubernetes.io/name: zipkin }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: zipkin }
  template:
    metadata:
      labels: { app.kubernetes.io/name: zipkin }
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          ports:
            - containerPort: 9411
          env:
            - { name: STORAGE_TYPE, value: mem }
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /health, port: 9411 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9411 }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: observability
  labels: { app.kubernetes.io/name: zipkin }
spec:
  selector: { app.kubernetes.io/name: zipkin }
  ports:
    - name: http
      port: 9411
      targetPort: 9411
