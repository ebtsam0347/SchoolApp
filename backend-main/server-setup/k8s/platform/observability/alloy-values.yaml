# grafana/alloy daemonset — successor to Promtail.
# Discovers pods, tails container logs via the Kubernetes API, forwards to Loki.

controller:
  type: daemonset

alloy:
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Discover all pods in the cluster.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Map kubernetes metadata onto Loki labels.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        // Map either Kubernetes app label convention onto a flat `app`
        // label. FSHRMS pods set the bare `app: <svc>` selector; Helm
        // charts (kube-prometheus-stack, Loki, etc.) set
        // `app.kubernetes.io/name`. Whichever is present, surface it as
        // `app` so Loki queries can use a single label.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          separator     = ";"
          regex         = "([^;]+);.*|;(.+)"
          replacement   = "${1}${2}"
          target_label  = "app"
        }
      }

      // Tail logs from those pods through the kubelet log API.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

serviceMonitor:
  enabled: false
