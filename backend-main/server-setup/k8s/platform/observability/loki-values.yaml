# grafana/loki chart, single-binary mode. Suitable for our single-VM scale.
# Replaces the deprecated grafana/loki-stack chart.
# Promtail is installed separately (see promtail-values.yaml).

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: false
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h   # 7d
  ruler:
    enable_api: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi   }

# Single-binary handles everything; turn off the SimpleScalable/Distributed pods.
backend:        { replicas: 0 }
read:           { replicas: 0 }
write:          { replicas: 0 }
ingester:       { replicas: 0 }
querier:        { replicas: 0 }
queryFrontend:  { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor:    { replicas: 0 }
compactor:      { replicas: 0 }
indexGateway:   { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway:   { replicas: 0 }
chunksCache:    { enabled: false }
resultsCache:   { enabled: false }

# kube-prometheus-stack handles dashboards/alerts; chart's bundled monitoring off.
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:  { enabled: false }
  dashboards:      { enabled: false }
  rules:           { enabled: false }

test:    { enabled: false }
gateway: { enabled: false }
